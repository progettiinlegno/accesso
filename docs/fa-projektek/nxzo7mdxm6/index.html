<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A hozzáférésed · Fa Projektek</title>
<style>
  html, body { margin:0; background:#ffffff; color:#151515; font-family:Montserrat, system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 20px; text-align:center; }
  .badge { display:inline-block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; background:#ffae00; color:#151515; font-weight:800; padding:6px 12px; border-radius:99px; }
  h1 { font-size:26px; line-height:1.25; margin:18px 0 10px; }
  h1 span { color:#ef9f27; }
  p { font-size:17px; line-height:1.55; color:#444444; }
  .card { background:#fff4dc; border:1px solid #f2e2bd; border-radius:16px; padding:24px 20px; margin-top:28px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#1F9D55; margin-right:8px; animation:p 1.6s infinite; }
  @keyframes p { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Sikeres vásárlás</span>
    <h1>Fa Projektek · <span>Több mint 100 építhető projekt + 3 bónusz</span></h1>
    <p>Köszönjük! Most készítjük el az anyagodat. <strong>48 órán belül</strong> itt találod a fő terméket és az összes bónuszt.</p>
    <div class="card">
      <p><span class="dot"></span><strong>Mentsd el ezt a linket</strong></p>
      <p>Ez a te hozzáférésed: ugyanez az oldal frissül majd az összes fájloddal.</p>
    </div>
  </div>
</body>
</html>
